# SonarQube project configuration
sonar.projectKey=BablAdm_fikak_app
sonar.projectName=fikak_app
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.
sonar.exclusions=**/__pycache__/**,*.pyc,.venv/**,venv/**,.git/**,.github/**

# Python-specific settings
sonar.python.version=3.11

# New code definition: use main branch as baseline for comparing new code
sonar.newCodeDefinitionType=reference_branch
sonar.newCodeDefinitionBranch=main
