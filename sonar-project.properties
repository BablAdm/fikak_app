sonar.projectKey=BablAdm_fikak_app
sonar.projectName=Fikak Application
sonar.projectVersion=1.0.0
sonar.organization=BablAdm

# Language
sonar.language=py
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions - Don't analyze test and cache directories
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/.git/**,**/node_modules/**,.github/**,*.pyc

# Test coverage
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.test.exclusions=**/__pycache__/**

# Python specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Security and quality settings
sonar.security.events.default=ACCEPT
sonar.qualitygate.wait=false

# Code analysis
sonar.analysis.mode=publish
