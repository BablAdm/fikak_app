sonar.projectKey=BablAdm_fikak_app
sonar.projectName=Fikak Application
sonar.projectVersion=1.0.0

# Language
sonar.language=py
sonar.sources=.

# Exclusions
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/tests/**,**/.git/**,**/node_modules/**

# Test coverage
sonar.tests=tests
sonar.test.inclusions=tests/**

# Python specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Security settings
sonar.security.events.default=log
