version: '3.8'

services:
  fikak_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fikak_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  fikak_app_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fikak_app_dev
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
    volumes:
      - ./app.py:/app/app.py
    command: ["python", "app.py"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
