version: '3.8'

services:
  fikak_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fikak_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  fikak_app_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fikak_app_dev
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - DEBUG=True
    volumes:
      - ./app.py:/app/app.py
    command: ["python", "app.py"]
    restart: unless-stopped
