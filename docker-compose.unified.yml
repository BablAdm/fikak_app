# Fikak App - Unified Docker Compose Setup
# This orchestrates Frappe backend + fikak-ui frontend + all dependencies

services:
  # ==================== Database Services ====================

  # NOTE: this stack is for local testing and stores MariaDB data on an
  # UNENCRYPTED Docker volume. Any production-like deployment must enable
  # data-at-rest encryption - see "Encryption at rest" in PRIVACY.md for
  # the key-management strategy (MariaDB encryption plugin backed by a
  # KMS/CMK, plus encrypted host volumes).
  mariadb:
    image: mariadb:10.6
    container_name: fikak_mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (setup.sh generates one)}
      MYSQL_DATABASE: fikak_db
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - fikak_network
    healthcheck:
      test: mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "3306:3306"

  # ==================== Cache & Queue Services ====================

  redis_cache:
    image: redis:6.2-alpine
    container_name: fikak_redis_cache
    networks:
      - fikak_network
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_queue:
    image: redis:6.2-alpine
    container_name: fikak_redis_queue
    networks:
      - fikak_network
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Frappe Backend Services ====================

  frappe_configurator:
    image: frappe/erpnext:v15.54.5
    container_name: fikak_configurator
    restart: "no"
    # Run the whole initialization sequence as one bash script so a failure
    # in any step is reported instead of being silently skipped
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host mariadb
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache "redis://redis_cache:6379"
        bench set-config -g redis_queue "redis://redis_queue:6379"
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: "redis://redis_cache:6379"
      REDIS_QUEUE: "redis://redis_queue:6379"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - fikak_network
    depends_on:
      mariadb:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      redis_queue:
        condition: service_healthy

  frappe_backend:
    image: frappe/erpnext:v15.54.5
    container_name: fikak_backend
    restart: unless-stopped
    command:
      - bash
      - -c
      - >
        bench serve --noreload --port 8000
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (setup.sh generates one)}
      REDIS_CACHE: "redis://redis_cache:6379"
      REDIS_QUEUE: "redis://redis_queue:6379"
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME:-localhost}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - fikak_network
    ports:
      - "8000:8000"
    depends_on:
      frappe_configurator:
        condition: service_completed_successfully
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  frappe_queue_short:
    image: frappe/erpnext:v15.54.5
    container_name: fikak_queue_short
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: "redis://redis_cache:6379"
      REDIS_QUEUE: "redis://redis_queue:6379"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - fikak_network
    depends_on:
      frappe_configurator:
        condition: service_completed_successfully

  frappe_queue_long:
    image: frappe/erpnext:v15.54.5
    container_name: fikak_queue_long
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: "redis://redis_cache:6379"
      REDIS_QUEUE: "redis://redis_queue:6379"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - fikak_network
    depends_on:
      frappe_configurator:
        condition: service_completed_successfully

  frappe_scheduler:
    image: frappe/erpnext:v15.54.5
    container_name: fikak_scheduler
    restart: unless-stopped
    command:
      - bench
      - schedule
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: "redis://redis_cache:6379"
      REDIS_QUEUE: "redis://redis_queue:6379"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - fikak_network
    depends_on:
      frappe_configurator:
        condition: service_completed_successfully

  frappe_socketio:
    image: frappe/erpnext:v15.54.5
    container_name: fikak_socketio
    restart: unless-stopped
    # Frappe v15 runs the persistent Socket.IO server via this Node entrypoint.
    # `bench socketio` only sets up dependencies and exits, so the container
    # would restart-loop and port 9000 would never come up.
    command:
      - node
      - apps/frappe/socketio.js
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: "redis://redis_cache:6379"
      REDIS_QUEUE: "redis://redis_queue:6379"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "9000:9000"
    networks:
      - fikak_network
    depends_on:
      frappe_configurator:
        condition: service_completed_successfully
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Frontend Service ====================

  fikak_ui:
    image: nginx:alpine
    container_name: fikak_ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./nginx-ui.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fikak_network
    depends_on:
      frappe_backend:
        condition: service_healthy
      # nginx resolves upstream hostnames once at startup and exits if a host
      # is missing, so wait until the Socket.IO service is up before starting
      frappe_socketio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Reverse Proxy (Optional) ====================

  nginx_proxy:
    image: nginx:alpine
    container_name: fikak_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fikak_network
    depends_on:
      - frappe_backend
      - fikak_ui
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

# ==================== Networks ====================

networks:
  fikak_network:
    driver: bridge
    name: fikak_network

# ==================== Volumes ====================

volumes:
  # Named with a fikak_app_ prefix (not just fikak_) to avoid colliding with
  # unrelated "fikak"-named projects that may already exist on the host -
  # Docker volume names are global, not scoped per Compose project, so a
  # bare "fikak_mariadb_data" can silently attach to someone else's volume
  # and its pre-existing root password/grants instead of a fresh one.
  mariadb_data:
    name: fikak_app_mariadb_data
  redis_cache_data:
    name: fikak_app_redis_cache_data
  redis_queue_data:
    name: fikak_app_redis_queue_data
  sites:
    name: fikak_app_sites
  logs:
    name: fikak_app_logs
  assets:
    name: fikak_app_assets
